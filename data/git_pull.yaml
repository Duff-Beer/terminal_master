# git_pull.yaml
schema_version: 2
command: git_pull
description: Fetches and merges remote changes into the current branch
description.de: Holt und merged Änderungen vom Remote in den aktuellen Branch
parameters:
  - name: use_sudo
    type: boolean
    flag: "sudo"
    description: Run with root privileges
    description.de: Mit Root‑Rechten ausführen
    default: false
    order: 0

  - name: remote
    type: text
    flag: ""
    description: Name of the remote (e.g. origin)
    description.de: Name des Remotes (z. B. origin)
    example: "origin"
    required: false
    order: 1

  - name: branch
    type: text
    flag: ""
    description: Branch name to pull
    description.de: Branch‑Name zum Pullen
    example: "main"
    required: false
    order: 2

  - name: rebase
    type: boolean
    flag: "--rebase"
    description: Use rebase instead of merge
    description.de: Rebase statt Merge verwenden
    default: false
    order: 3

  - name: verbose
    type: boolean
    flag: "-v"
    description: Verbose output
    description.de: Ausführliche Ausgabe
    default: false
    order: 4

help_text: |
  Common usage:
  - Simple pull: `git pull`
  - Pull and rebase from origin/main: `git pull --rebase origin main`
help_text.de: |
  Standard‑Anwendung:
  - Einfaches Pullen: `git pull`
  - Von origin/main pull & rebase: `git pull --rebase origin main`
