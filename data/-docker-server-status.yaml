schema_version: 2
commands:
  - title: Docker service status
    title.de: Status des Docker-Dienstes
    description: Shows whether the Docker daemon is running and recent service messages (Linux with systemd).
    description.de: Zeigt, ob der Docker-Dienst läuft, sowie aktuelle Dienstmeldungen (Linux mit systemd).
    command: systemctl status docker --no-pager

  - title: Recent Docker daemon logs
    title.de: Aktuelle Docker-Daemon-Protokolle
    description: Shows the latest 200 log entries from the Docker service (Linux with systemd).
    description.de: Zeigt die letzten 200 Protokolleinträge des Docker-Dienstes (Linux mit systemd).
    command: journalctl -u docker.service -n 200 --no-pager

  - title: Docker daemon warnings and errors
    title.de: Warnungen und Fehler des Docker-Daemons
    description: Shows warning-level and more severe Docker service logs from the current boot.
    description.de: Zeigt Warnungen und schwerwiegendere Protokolle des Docker-Dienstes seit dem aktuellen Systemstart.
    command: journalctl -b -u docker.service -p warning --no-pager

  - title: Docker engine information
    title.de: Docker-Engine-Informationen
    description: Shows Docker engine, storage, runtime, and host details.
    description.de: Zeigt Informationen zu Docker-Engine, Speicher, Laufzeitumgebung und Host.
    command: docker info

  - title: Running containers
    title.de: Laufende Container
    description: Lists running containers, their status, ports, and names.
    description.de: Listet laufende Container mit Status, Ports und Namen auf.
    command: docker ps

  - title: All containers
    title.de: Alle Container
    description: Lists all containers, including stopped containers.
    description.de: Listet alle Container einschließlich angehaltener Container auf.
    command: docker ps --all

  - title: Container resource usage
    title.de: Ressourcenverbrauch der Container
    description: Shows a one-time snapshot of CPU, memory, network, and block I/O usage for running containers.
    description.de: Zeigt einmalig CPU-, Speicher-, Netzwerk- und Datenträgerverbrauch laufender Container.
    command: docker stats --no-stream

  - title: Docker disk usage
    title.de: Docker-Speicherverbrauch
    description: Summarizes disk usage by images, containers, local volumes, and build cache.
    description.de: Fasst den Speicherverbrauch von Images, Containern, lokalen Volumes und Build-Cache zusammen.
    command: docker system df

  - title: Compose projects
    title.de: Compose-Projekte
    description: Lists Compose projects known to the Docker daemon.
    description.de: Listet dem Docker-Daemon bekannte Compose-Projekte auf.
    command: docker compose ls

  - title: Current Compose project containers
    title.de: Container des aktuellen Compose-Projekts
    description: Lists containers for the Compose project in the current directory, including stopped containers.
    description.de: Listet Container des Compose-Projekts im aktuellen Verzeichnis einschließlich angehaltener Container auf.
    command: docker compose ps --all

  - title: Current Compose project logs
    title.de: Protokolle des aktuellen Compose-Projekts
    description: Shows the latest 100 timestamped log lines for services in the Compose project in the current directory.
    description.de: Zeigt die letzten 100 Protokollzeilen mit Zeitstempel für Dienste des Compose-Projekts im aktuellen Verzeichnis.
    command: docker compose logs --tail=100 --timestamps

  - title: Recent Docker events
    title.de: Aktuelle Docker-Ereignisse
    description: Shows Docker events from the last hour and then exits.
    description.de: Zeigt Docker-Ereignisse der letzten Stunde an und beendet sich anschließend.
    command: docker events --since 1h --until 0s
