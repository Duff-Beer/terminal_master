# git_clone.yaml
schema_version: 2
command: git_clone
description: Clones a remote repository locally
description.de: Klont ein Remote‑Repository lokal
parameters:
  - name: use_sudo
    type: boolean
    flag: "sudo"
    description: Run with root privileges
    description.de: Mit Root‑Rechten ausführen
    default: false
    order: 0

  - name: repository
    type: text
    flag: ""
    description: URL of the repository to clone
    description.de: URL des zu klonenden Repositories
    example: "https://github.com/user/repo.git"
    required: true
    order: 1

  - name: directory
    type: filepath
    mode: directory
    flag: ""
    description: Target directory (will be created)
    description.de: Zielverzeichnis (wird neu erstellt)
    example: "my-project"
    example.de: "mein-projekt"
    required: false
    order: 2

  - name: depth
    type: text
    flag: "--depth"
    description: Depth for a shallow clone (number of commits)
    description.de: Tiefe für einen „shallow“ Clone (Anzahl der Commits)
    example: "1"
    required: false
    order: 3

  - name: verbose
    type: boolean
    flag: "-v"
    description: Verbose output
    description.de: Ausführliche Ausgabe
    default: false
    order: 4

help_text: |
  Common usage:
  - Full clone: `git clone https://github.com/user/repo.git`
  - Clone into a specific directory: `git clone https://... my-project`
  - Clone only the latest commit: `git clone --depth 1 https://...`
help_text.de: |
  Standard‑Anwendung:
  - Vollständiges Klonen: `git clone https://github.com/user/repo.git`
  - Klonen in spezielles Verzeichnis: `git clone https://... mein-projekt`
  - Nur letzten Commit klonen: `git clone --depth 1 https://...`
