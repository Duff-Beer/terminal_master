schema_version: 2
command: nmap
display_name: Nmap Advanced
description: Network discovery, service enumeration, and security scanner
description.de: Netzwerkerkennung, Diensteauflistung und Sicherheitsscanner
parameters:
  - name: use_sudo
    type: boolean
    flag: sudo
    description: Run Nmap with elevated privileges for raw-packet scan types
    description.de: Nmap mit erhöhten Rechten ausführen, nötig für Raw-Packet-Scanarten
    default: false
    order: 0

  - name: scan_technique
    type: options
    flag: ""
    description: Primary scan technique; leave empty to use the Nmap default
    description.de: Primäre Scanart; leer lassen, um den Nmap-Standard zu verwenden
    order: 10
    options:
      - value: -sS
        description: TCP SYN scan
        description.de: TCP-SYN-Scan
      - value: -sT
        description: TCP connect scan
        description.de: TCP-Connect-Scan
      - value: -sA
        description: TCP ACK scan
        description.de: TCP-ACK-Scan
      - value: -sW
        description: TCP Window scan
        description.de: TCP-Window-Scan
      - value: -sM
        description: TCP Maimon scan
        description.de: TCP-Maimon-Scan
      - value: -sU
        description: UDP scan
        description.de: UDP-Scan
      - value: -sN
        description: TCP Null scan
        description.de: TCP-Null-Scan
      - value: -sF
        description: TCP FIN scan
        description.de: TCP-FIN-Scan
      - value: -sX
        description: TCP Xmas scan
        description.de: TCP-Xmas-Scan
      - value: -sY
        description: SCTP INIT scan
        description.de: SCTP-INIT-Scan
      - value: -sZ
        description: SCTP COOKIE-ECHO scan
        description.de: SCTP-COOKIE-ECHO-Scan
      - value: -sO
        description: IP protocol scan
        description.de: IP-Protokoll-Scan

  - name: custom_scan_flags
    type: text
    flag: --scanflags
    description: Custom TCP flags such as SYNACK or URGACKPSHRSTSYNFIN
    description.de: Eigene TCP-Flags wie SYNACK oder URGACKPSHRSTSYNFIN
    example: SYNACK
    order: 11

  - name: idle_scan_zombie
    type: text
    flag: -sI
    description: Zombie host and optional probe port for an idle scan
    description.de: Zombie-Host und optionaler Probe-Port für einen Idle-Scan
    example: zombie.example.com:80
    order: 12

  - name: ftp_bounce_host
    type: text
    flag: -b
    description: FTP relay host for an FTP bounce scan
    description.de: FTP-Relay-Host für einen FTP-Bounce-Scan
    example: user:password@ftp.example.com:21
    order: 13

  - name: list_scan
    type: boolean
    flag: -sL
    description: List targets without scanning them
    description.de: Ziele auflisten, ohne sie zu scannen
    default: false
    order: 20

  - name: ping_scan
    type: boolean
    flag: -sn
    description: Perform host discovery without a port scan
    description.de: Nur Hosterkennung ohne Portscan durchführen
    default: false
    order: 21

  - name: skip_host_discovery
    type: boolean
    flag: -Pn
    description: Treat every target as online and skip host discovery
    description.de: Alle Ziele als online behandeln und die Hosterkennung überspringen
    default: false
    order: 22

  - name: syn_discovery_ports
    type: text
    flag: -PS
    join: attached
    description: TCP SYN discovery ports
    description.de: TCP-SYN-Ports für die Hosterkennung
    example: 22,80,443
    order: 23

  - name: ack_discovery_ports
    type: text
    flag: -PA
    join: attached
    description: TCP ACK discovery ports
    description.de: TCP-ACK-Ports für die Hosterkennung
    example: 80,443
    order: 24

  - name: udp_discovery_ports
    type: text
    flag: -PU
    join: attached
    description: UDP discovery ports
    description.de: UDP-Ports für die Hosterkennung
    example: 53,161
    order: 25

  - name: icmp_echo_discovery
    type: boolean
    flag: -PE
    description: Use ICMP echo requests for host discovery
    description.de: ICMP-Echo-Anfragen für die Hosterkennung verwenden
    default: false
    order: 26

  - name: no_dns
    type: boolean
    flag: -n
    description: Never perform DNS resolution
    description.de: Niemals DNS-Auflösung durchführen
    conflicts_with: [always_dns]
    default: false
    order: 27

  - name: always_dns
    type: boolean
    flag: -R
    description: Always perform DNS resolution
    description.de: Immer DNS-Auflösung durchführen
    conflicts_with: [no_dns]
    default: false
    order: 28

  - name: dns_servers
    type: text
    flag: --dns-servers
    description: Comma-separated DNS servers used for reverse resolution
    description.de: Kommagetrennte DNS-Server für die Reverse-Auflösung
    example: 1.1.1.1,8.8.8.8
    order: 29

  - name: system_dns
    type: boolean
    flag: --system-dns
    description: Use the operating system DNS resolver
    description.de: Den DNS-Resolver des Betriebssystems verwenden
    default: false
    order: 30

  - name: traceroute
    type: boolean
    flag: --traceroute
    description: Trace the network path to each target
    description.de: Netzwerkpfad zu jedem Ziel verfolgen
    default: false
    order: 31

  - name: ports
    type: text
    flag: -p
    description: Ports or protocol-qualified ranges to scan
    description.de: Zu scannende Ports oder protokollqualifizierte Bereiche
    example: 22,80,443 or U:53,T:1-1024
    order: 40

  - name: exclude_ports
    type: text
    flag: --exclude-ports
    description: Ports that must not be scanned
    description.de: Ports, die nicht gescannt werden dürfen
    example: 25,445
    order: 41

  - name: fast_scan
    type: boolean
    flag: -F
    description: Scan fewer ports than the default scan
    description.de: Weniger Ports als beim Standardscan prüfen
    default: false
    order: 42

  - name: sequential_ports
    type: boolean
    flag: -r
    description: Scan ports sequentially instead of randomizing their order
    description.de: Ports der Reihe nach statt in zufälliger Ordnung scannen
    default: false
    order: 43

  - name: top_ports
    type: text
    flag: --top-ports
    description: Scan the specified number of most common ports
    description.de: Die angegebene Anzahl der häufigsten Ports scannen
    example: "100"
    order: 44

  - name: port_ratio
    type: text
    flag: --port-ratio
    description: Scan ports more common than this ratio
    description.de: Ports scannen, die häufiger als dieses Verhältnis sind
    example: "0.1"
    order: 45

  - name: version_detection
    type: boolean
    flag: -sV
    description: Probe open ports for service and version information
    description.de: Offene Ports auf Dienst- und Versionsinformationen prüfen
    default: false
    order: 50

  - name: version_intensity
    type: options
    flag: --version-intensity
    description: Version probe intensity from 0 to 9; requires version detection
    description.de: Intensität der Versionsprüfung von 0 bis 9; benötigt Versionserkennung
    depends_on: [version_detection]
    visible_when:
      parameter: version_detection
      equals: true
    order: 51
    options:
      - value: "0"
        description: Use only the lightest probes
        description.de: Nur die leichtesten Prüfungen verwenden
      - value: "2"
        description: Light version detection
        description.de: Leichte Versionserkennung
      - value: "5"
        description: Default probe intensity
        description.de: Standard-Prüfintensität
      - value: "7"
        description: Thorough version detection
        description.de: Gründliche Versionserkennung
      - value: "9"
        description: Try every version probe
        description.de: Alle Versionsprüfungen versuchen

  - name: version_trace
    type: boolean
    flag: --version-trace
    description: Show detailed version detection activity
    description.de: Detaillierten Ablauf der Versionserkennung anzeigen
    depends_on: [version_detection]
    visible_when:
      parameter: version_detection
      equals: true
    default: false
    order: 52

  - name: default_scripts
    type: boolean
    flag: -sC
    description: Run the default Nmap Scripting Engine scripts
    description.de: Die Standardskripte der Nmap Scripting Engine ausführen
    default: false
    order: 60

  - name: scripts
    type: text
    flag: --script
    description: Comma-separated NSE scripts, categories, or expressions
    description.de: Kommagetrennte NSE-Skripte, Kategorien oder Ausdrücke
    example: safe,vuln or http-title
    order: 61

  - name: script_args
    type: text
    flag: --script-args
    description: Comma-separated NSE script arguments
    description.de: Kommagetrennte Argumente für NSE-Skripte
    example: user=admin,password=secret
    visible_when:
      any:
        - parameter: default_scripts
          equals: true
        - parameter: scripts
          active: true
    order: 62

  - name: script_args_file
    type: filepath
    mode: file
    flag: --script-args-file
    description: File containing NSE script arguments
    description.de: Datei mit Argumenten für NSE-Skripte
    visible_when:
      any:
        - parameter: default_scripts
          equals: true
        - parameter: scripts
          active: true
    order: 63

  - name: script_trace
    type: boolean
    flag: --script-trace
    description: Show all data sent and received by NSE scripts
    description.de: Alle von NSE-Skripten gesendeten und empfangenen Daten anzeigen
    visible_when:
      any:
        - parameter: default_scripts
          equals: true
        - parameter: scripts
          active: true
    default: false
    order: 64

  - name: os_detection
    type: boolean
    flag: -O
    description: Enable operating system detection
    description.de: Betriebssystemerkennung aktivieren
    default: false
    order: 70

  - name: os_scan_limit
    type: boolean
    flag: --osscan-limit
    description: Limit OS detection to promising targets
    description.de: OS-Erkennung auf vielversprechende Ziele beschränken
    depends_on: [os_detection]
    visible_when:
      parameter: os_detection
      equals: true
    default: false
    order: 71

  - name: os_scan_guess
    type: boolean
    flag: --osscan-guess
    description: Guess the operating system more aggressively
    description.de: Das Betriebssystem aggressiver erraten
    depends_on: [os_detection]
    visible_when:
      parameter: os_detection
      equals: true
    default: false
    order: 72

  - name: timing_template
    type: options
    flag: ""
    description: Timing template from paranoid to insane
    description.de: Timing-Vorlage von paranoid bis insane
    order: 80
    options:
      - value: -T0
        description: Paranoid
        description.de: Paranoid
      - value: -T1
        description: Sneaky
        description.de: Verstohlen
      - value: -T2
        description: Polite
        description.de: Höflich
      - value: -T3
        description: Normal
        description.de: Normal
      - value: -T4
        description: Aggressive
        description.de: Aggressiv
      - value: -T5
        description: Insane
        description.de: Extrem

  - name: min_hostgroup
    type: text
    flag: --min-hostgroup
    description: Minimum parallel host scan group size
    description.de: Minimale Gruppengröße für parallel gescannte Hosts
    example: "16"
    order: 81

  - name: max_hostgroup
    type: text
    flag: --max-hostgroup
    description: Maximum parallel host scan group size
    description.de: Maximale Gruppengröße für parallel gescannte Hosts
    example: "256"
    order: 82

  - name: max_retries
    type: text
    flag: --max-retries
    description: Maximum number of probe retransmissions
    description.de: Maximale Anzahl erneuter Prüfsendungen
    example: "3"
    order: 83

  - name: host_timeout
    type: text
    flag: --host-timeout
    description: Stop scanning a host after this duration
    description.de: Scan eines Hosts nach dieser Dauer abbrechen
    example: 5m
    order: 84

  - name: scan_delay
    type: text
    flag: --scan-delay
    description: Minimum delay between probes
    description.de: Minimale Verzögerung zwischen Prüfungen
    example: 100ms
    order: 85

  - name: min_rate
    type: text
    flag: --min-rate
    description: Send packets no slower than this rate per second
    description.de: Pakete nicht langsamer als mit dieser Rate pro Sekunde senden
    example: "100"
    order: 86

  - name: max_rate
    type: text
    flag: --max-rate
    description: Send packets no faster than this rate per second
    description.de: Pakete nicht schneller als mit dieser Rate pro Sekunde senden
    example: "1000"
    order: 87

  - name: fragmented_packets
    type: boolean
    flag: -f
    description: Fragment IP packets into small pieces
    description.de: IP-Pakete in kleine Teile fragmentieren
    default: false
    order: 90

  - name: mtu
    type: text
    flag: --mtu
    description: Use the specified packet fragmentation MTU
    description.de: Die angegebene MTU für die Paketfragmentierung verwenden
    example: "24"
    order: 91

  - name: decoys
    type: text
    flag: -D
    description: Comma-separated decoy addresses, optionally including ME
    description.de: Kommagetrennte Täuschadressen, optional einschließlich ME
    example: RND:5,ME
    order: 92

  - name: source_address
    type: text
    flag: -S
    description: Spoof the source IP address
    description.de: Die Quell-IP-Adresse fälschen
    example: 192.0.2.10
    order: 93

  - name: interface
    type: text
    flag: -e
    description: Network interface to use
    description.de: Zu verwendende Netzwerkschnittstelle
    example: eth0
    order: 94

  - name: source_port
    type: text
    flag: --source-port
    description: Source port used for probes
    description.de: Quellport für die Prüfungen
    example: "53"
    order: 95

  - name: proxies
    type: text
    flag: --proxies
    description: Comma-separated HTTP or SOCKS4 proxy URLs
    description.de: Kommagetrennte HTTP- oder SOCKS4-Proxy-URLs
    example: http://127.0.0.1:8080
    order: 96

  - name: data_string
    type: text
    flag: --data-string
    description: ASCII payload appended to sent packets
    description.de: ASCII-Nutzlast, die gesendeten Paketen angehängt wird
    example: probe-data
    order: 97

  - name: data_length
    type: text
    flag: --data-length
    description: Number of random payload bytes to append
    description.de: Anzahl anzuhängender zufälliger Nutzlast-Bytes
    example: "32"
    order: 98

  - name: ttl
    type: text
    flag: --ttl
    description: IP time-to-live value
    description.de: IP-Time-to-Live-Wert
    example: "64"
    order: 99

  - name: spoof_mac
    type: text
    flag: --spoof-mac
    description: MAC address, prefix, or vendor name to spoof
    description.de: Zu fälschende MAC-Adresse, Präfix oder Herstellername
    example: "0"
    order: 100

  - name: bad_checksum
    type: boolean
    flag: --badsum
    description: Send packets with invalid checksums
    description.de: Pakete mit ungültigen Prüfsummen senden
    default: false
    order: 101

  - name: output_normal
    type: text
    flag: -oN
    description: Write normal output to this file
    description.de: Normale Ausgabe in diese Datei schreiben
    example: scan.txt
    order: 110

  - name: output_xml
    type: text
    flag: -oX
    description: Write XML output to this file
    description.de: XML-Ausgabe in diese Datei schreiben
    example: scan.xml
    order: 111

  - name: output_grepable
    type: text
    flag: -oG
    description: Write grepable output to this file
    description.de: Grepbare Ausgabe in diese Datei schreiben
    example: scan.gnmap
    order: 112

  - name: output_all
    type: text
    flag: -oA
    description: Base name for normal, XML, and grepable output files
    description.de: Basisname für normale, XML- und grepbare Ausgabedateien
    conflicts_with: [output_normal, output_xml, output_grepable]
    example: scan
    order: 113

  - name: verbosity
    type: options
    flag: ""
    description: Increase output verbosity
    description.de: Ausführlichkeit der Ausgabe erhöhen
    order: 114
    options:
      - value: -v
        description: Verbose
        description.de: Ausführlich
      - value: -vv
        description: More verbose
        description.de: Ausführlicher
      - value: -vvv
        description: Very verbose
        description.de: Sehr ausführlich

  - name: debugging
    type: options
    flag: ""
    description: Increase debugging output
    description.de: Debug-Ausgabe erhöhen
    order: 115
    options:
      - value: -d
        description: Debug output
        description.de: Debug-Ausgabe
      - value: -dd
        description: More debugging output
        description.de: Mehr Debug-Ausgabe
      - value: -ddd
        description: Very detailed debugging output
        description.de: Sehr detaillierte Debug-Ausgabe

  - name: show_reason
    type: boolean
    flag: --reason
    description: Show why each port is in its reported state
    description.de: Anzeigen, warum jeder Port im gemeldeten Zustand ist
    default: false
    order: 116

  - name: open_only
    type: boolean
    flag: --open
    description: Show only open or possibly open ports
    description.de: Nur offene oder möglicherweise offene Ports anzeigen
    default: false
    order: 117

  - name: packet_trace
    type: boolean
    flag: --packet-trace
    description: Show every packet sent and received
    description.de: Jedes gesendete und empfangene Paket anzeigen
    default: false
    order: 118

  - name: append_output
    type: boolean
    flag: --append-output
    description: Append instead of overwriting output files
    description.de: Ausgabedateien ergänzen statt überschreiben
    default: false
    order: 119

  - name: ipv6
    type: boolean
    flag: "-6"
    description: Enable IPv6 scanning
    description.de: IPv6-Scans aktivieren
    default: false
    order: 120

  - name: aggressive_scan
    type: boolean
    flag: -A
    description: Enable OS detection, version detection, scripts, and traceroute
    description.de: OS-Erkennung, Versionserkennung, Skripte und Traceroute aktivieren
    default: false
    order: 121

  - name: privilege_mode
    type: options
    flag: ""
    description: Override Nmap privilege detection
    description.de: Die Rechteerkennung von Nmap übersteuern
    order: 122
    options:
      - value: --privileged
        description: Assume full privileges
        description.de: Volle Rechte annehmen
      - value: --unprivileged
        description: Assume no raw-socket privileges
        description.de: Keine Raw-Socket-Rechte annehmen

  - name: send_mode
    type: options
    flag: ""
    description: Select raw Ethernet frames or IP packets
    description.de: Rohe Ethernet-Frames oder IP-Pakete wählen
    order: 123
    options:
      - value: --send-eth
        description: Send raw Ethernet frames
        description.de: Rohe Ethernet-Frames senden
      - value: --send-ip
        description: Send raw IP packets
        description.de: Rohe IP-Pakete senden

  - name: exclude_hosts
    type: text
    flag: --exclude
    description: Comma-separated hosts or networks to exclude
    description.de: Kommagetrennte auszuschließende Hosts oder Netzwerke
    example: 192.168.1.1,192.168.2.0/24
    order: 124

  - name: exclude_file
    type: filepath
    mode: file
    flag: --excludefile
    description: File containing hosts or networks to exclude
    description.de: Datei mit auszuschließenden Hosts oder Netzwerken
    order: 125

  - name: target
    type: text_list
    flag: ""
    required: true
    description: Hostnames, IP addresses, ranges, or CIDR networks to scan
    description.de: Zu scannende Hostnamen, IP-Adressen, Bereiche oder CIDR-Netzwerke
    example: scanme.nmap.org or 192.168.1.0/24
    order: 1000

help_text: |
  This configuration covers the main Nmap option groups from the official
  reference guide. Options can be combined unless Nmap itself forbids the
  combination. Some raw-packet scan types require elevated privileges.

  Examples:
  - SYN and version scan: `sudo nmap -sS -sV -p 22,80,443 -T4 target`
  - Default NSE scripts and OS detection: `sudo nmap -sC -O target`
  - XML report: `nmap -sT -oX scan.xml target`

  Only scan systems and networks for which you have explicit authorization.
help_text.de: |
  Diese Konfiguration deckt die wichtigsten Nmap-Optionsgruppen aus dem
  offiziellen Referenzhandbuch ab. Optionen lassen sich kombinieren, sofern
  Nmap selbst die Kombination nicht ausschließt. Einige Raw-Packet-Scanarten
  benötigen erhöhte Rechte.

  Beispiele:
  - SYN- und Versionsscan: `sudo nmap -sS -sV -p 22,80,443 -T4 ziel`
  - Standard-NSE-Skripte und OS-Erkennung: `sudo nmap -sC -O ziel`
  - XML-Bericht: `nmap -sT -oX scan.xml ziel`

  Scanne nur Systeme und Netzwerke, für die du eine ausdrückliche Erlaubnis hast.
