schema_version: 2
command: docker
display_name: Docker
display_name.de: Docker
description: Manage Docker containers, images, networks and volumes.
description.de: Docker-Container, Images, Netzwerke und Volumes verwalten.
parameters:
  - name: action
    type: options
    flag: ""
    required: true
    description: Choose a Docker command. The listed operations are primarily for inspection.
    description.de: Docker-Befehl auswählen. Die aufgeführten Aktionen dienen hauptsächlich der Anzeige.
    order: 10
    options:
      - value: ps
        description: List running containers.
        description.de: Laufende Container auflisten.
      - value: ps --all
        description: List all containers, including stopped ones.
        description.de: Alle Container einschließlich gestoppter auflisten.
      - value: images
        description: List local images.
        description.de: Lokale Images auflisten.
      - value: image ls --all
        description: List all local images, including intermediate images.
        description.de: Alle lokalen Images einschließlich Zwischen-Images auflisten.
      - value: volume ls
        description: List Docker volumes.
        description.de: Docker-Volumes auflisten.
      - value: network ls
        description: List Docker networks.
        description.de: Docker-Netzwerke auflisten.
      - value: info
        description: Show Docker engine and host information.
        description.de: Informationen zur Docker-Engine und zum Host anzeigen.
      - value: version
        description: Show Docker client and server versions.
        description.de: Docker-Client- und Serverversion anzeigen.

  - name: format
    type: text
    flag: --format
    description: Optional Go template for formatted output. Supported by list commands such as ps, images, volume ls, and network ls.
    description.de: Optionales Go-Template für formatierte Ausgabe. Unterstützt von Listenbefehlen wie ps, images, volume ls und network ls.
    example: '{{.Names}}\t{{.Status}}'
    order: 20

help_text: |
  Docker CLI. Examples:
  - List running containers: `docker ps`
  - List all containers: `docker ps --all`
  - List images: `docker images`
  - The optional format field is intended for list commands; leave it empty for other actions.

  Removing containers, images, volumes or networks can destroy data. Those destructive operations are intentionally not included here.
help_text.de: |
  Docker-Kommandozeile. Beispiele:
  - Laufende Container anzeigen: `docker ps`
  - Alle Container anzeigen: `docker ps --all`
  - Images anzeigen: `docker images`
  - Das optionale Formatfeld ist für Listenbefehle gedacht; bei anderen Aktionen leer lassen.

  Das Entfernen von Containern, Images, Volumes oder Netzwerken kann Daten löschen. Diese destruktiven Aktionen sind hier absichtlich nicht enthalten.
