schema_version: 2
command: ssh
display_name: SSH connection
display_name.de: SSH-Verbindung
description: Opens an SSH connection to a predefined host
description.de: Erstellt eine SSH-Verbindung zu einem vordefinierten Host
parameters:
  - name: username
    type: text
    flag: -l
    description: User name on the remote system
    description.de: Benutzername auf dem entfernten System
    example: deploy
    order: 10

  - name: port
    type: text
    flag: -p
    description: SSH port of the target system
    description.de: SSH-Port des Zielsystems
    example: "22"
    order: 20

  - name: identity_file
    type: filepath
    mode: file
    flag: -i
    description: Private SSH key used for the login
    description.de: Privater SSH-Schlüssel für die Anmeldung
    example: ~/.ssh/id_ed25519
    order: 30

  - name: jump_host
    type: text
    flag: -J
    description: Optional ProxyJump or bastion host
    description.de: Optionaler ProxyJump- oder Bastion-Host
    example: bastion.example.com
    order: 40

  - name: force_ipv4
    type: boolean
    flag: "-4"
    description: Use IPv4 only
    description.de: Ausschließlich IPv4 verwenden
    conflicts_with: [force_ipv6]
    default: false
    order: 50

  - name: force_ipv6
    type: boolean
    flag: "-6"
    description: Use IPv6 only
    description.de: Ausschließlich IPv6 verwenden
    conflicts_with: [force_ipv4]
    default: false
    order: 51

  - name: compression
    type: boolean
    flag: -C
    description: Enable compression for the connection
    description.de: Komprimierung für die Verbindung aktivieren
    default: false
    order: 60

  - name: agent_forwarding
    type: boolean
    flag: -A
    description: Enable forwarding of the local SSH agent
    description.de: Weiterleitung des lokalen SSH-Agenten aktivieren
    default: false
    order: 70

  - name: x11_forwarding
    type: boolean
    flag: -X
    description: Enable X11 forwarding
    description.de: X11-Weiterleitung aktivieren
    default: false
    order: 71

  - name: batch_mode
    type: boolean
    flag: -o BatchMode=yes
    description: Disable interactive password and confirmation prompts
    description.de: Interaktive Passwort- und Bestätigungsabfragen deaktivieren
    default: false
    order: 80

  - name: host_key_checking
    type: options
    flag: ""
    description: Behaviour for unknown or changed host keys
    description.de: Verhalten bei unbekannten oder geänderten Host-Schlüsseln
    order: 90
    options:
      - value: -o StrictHostKeyChecking=yes
        description: Allow only known, unchanged host keys
        description.de: Nur bereits bekannte, unveränderte Host-Schlüssel zulassen
      - value: -o StrictHostKeyChecking=accept-new
        description: Accept new host keys, reject changed ones
        description.de: Neue Host-Schlüssel akzeptieren, geänderte ablehnen

  - name: verbosity
    type: options
    flag: ""
    description: Amount of SSH diagnostic output
    description.de: Umfang der SSH-Diagnoseausgabe
    order: 95
    options:
      - value: -v
        description: Verbose diagnostic output
        description.de: Ausführliche Diagnoseausgabe
      - value: -vv
        description: Very verbose diagnostic output
        description.de: Sehr ausführliche Diagnoseausgabe
      - value: -vvv
        description: Maximum diagnostic output
        description.de: Maximale Diagnoseausgabe

  - name: host
    type: options
    flag: ""
    description: Target host or alias from ~/.ssh/config
    description.de: Zielhost oder Alias aus ~/.ssh/config
    required: true
    default: localhost
    order: 100
    options:
      - value: localhost
        description: Local SSH server
        description.de: Lokaler SSH-Server
      - value: staging.example.com
        description: Example host for a staging environment
        description.de: Beispielhost für eine Staging-Umgebung
      - value: production.example.com
        description: Example host for a production environment
        description.de: Beispielhost für eine Produktionsumgebung

  - name: remote_command
    type: text
    flag: ""
    description: Optional command to run after connecting
    description.de: Optionaler Befehl, der nach dem Verbinden ausgeführt wird
    example: uptime && whoami
    order: 110

help_text: |
  Pick the target host from the dropdown. Replace the example hosts in ssh.yaml
  with real host names, IP addresses or aliases from ~/.ssh/config.

  Examples:
  - Connect: `ssh production.example.com`
  - With user and port: `ssh -l deploy -p 2222 production.example.com`
  - Via bastion host: `ssh -J bastion.example.com production.example.com`
  - Remote command: `ssh production.example.com 'uptime && whoami'`
help_text.de: |
  Wähle den Zielhost im Dropdown aus. Ersetze die Beispielhosts in ssh.yaml
  durch reale Hostnamen, IP-Adressen oder Aliase aus ~/.ssh/config.

  Beispiele:
  - Verbindung: `ssh production.example.com`
  - Mit Benutzer und Port: `ssh -l deploy -p 2222 production.example.com`
  - Über Bastion-Host: `ssh -J bastion.example.com production.example.com`
  - Remote-Befehl: `ssh production.example.com 'uptime && whoami'`
