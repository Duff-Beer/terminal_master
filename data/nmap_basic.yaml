schema_version: 2
command: nmap
display_name: Nmap Basic
description: Simple Nmap scans with safe defaults and predefined targets
description.de: Einfache Nmap-Scans mit sicheren Standardoptionen und vordefinierten Zielen
parameters:
  - name: use_sudo
    type: boolean
    flag: sudo
    description: Run with elevated privileges, for example for SYN or OS scans
    description.de: Mit erhöhten Rechten ausführen, etwa für SYN- oder OS-Scans
    default: false
    order: 0

  - name: host_discovery_only
    type: boolean
    flag: -sn
    description: Only look for reachable hosts and run no port scan
    description.de: Nur erreichbare Hosts suchen und keinen Portscan durchführen
    default: false
    order: 9

  - name: scan_type
    type: options
    flag: ""
    description: Scan type; without a selection Nmap uses the fitting default
    description.de: Scanart; ohne Auswahl verwendet Nmap den passenden Standard
    visible_when:
      parameter: host_discovery_only
      active: false
    order: 10
    options:
      - value: -sS
        description: Fast TCP SYN scan, usually needs elevated privileges
        description.de: Schneller TCP-SYN-Scan, benötigt meist erhöhte Rechte
      - value: -sT
        description: TCP connect scan without raw socket privileges
        description.de: TCP-Connect-Scan ohne Raw-Socket-Rechte
      - value: -sU
        description: UDP scan, usually needs elevated privileges
        description.de: UDP-Scan, benötigt meist erhöhte Rechte
      - value: -A
        description: Operating system, services, default scripts and traceroute
        description.de: Betriebssystem, Dienste, Standardskripte und Traceroute

  - name: port_preset
    type: options
    flag: -p
    description: Commonly used port selection
    description.de: Häufig verwendete Portauswahl
    visible_when:
      parameter: host_discovery_only
      active: false
    order: 20
    options:
      - value: "22"
        description: SSH
      - value: 80,443
        description: HTTP and HTTPS
        description.de: HTTP und HTTPS
      - value: 22,80,443
        description: SSH and web services
        description.de: SSH und Webdienste
      - value: 1-1024
        description: Well-known system ports
        description.de: Bekannte Systemports
      - value: 1-65535
        description: All TCP ports
        description.de: Alle TCP-Ports
  - name: custom_ports
    type: text
    flag: -p
    description: Custom ports or ranges instead of the port preset
    description.de: Eigene Ports oder Bereiche statt der Port-Vorauswahl
    conflicts_with: [port_preset]
    visible_when:
      parameter: host_discovery_only
      active: false
    example: 21-25,80,443,8080
    order: 21

  - name: version_detection
    type: boolean
    flag: -sV
    description: Detect services and versions on open ports
    description.de: Dienste und Versionen auf offenen Ports erkennen
    visible_when:
      parameter: host_discovery_only
      active: false
    default: false
    order: 30

  - name: os_detection
    type: boolean
    flag: -O
    description: Detect the target's operating system, usually needs elevated privileges
    description.de: Betriebssystem des Ziels erkennen, benötigt meist erhöhte Rechte
    visible_when:
      parameter: host_discovery_only
      active: false
    default: false
    order: 31

  - name: default_scripts
    type: boolean
    flag: -sC
    description: Run the Nmap default scripts
    description.de: Nmap-Standardskripte ausführen
    visible_when:
      parameter: host_discovery_only
      active: false
    default: false
    order: 32

  - name: timing
    type: options
    flag: ""
    description: Speed of the scan
    description.de: Geschwindigkeit des Scans
    default: -T3
    order: 40
    options:
      - value: -T2
        description: Slow and gentle on the network
        description.de: Langsam und netzwerkschonend
      - value: -T3
        description: Normal
      - value: -T4
        description: Fast, for reliable local networks
        description.de: Schnell für zuverlässige lokale Netzwerke

  - name: no_dns
    type: boolean
    flag: -n
    description: Perform no DNS name resolution
    description.de: Keine DNS-Namensauflösung durchführen
    default: false
    order: 50

  - name: traceroute
    type: boolean
    flag: --traceroute
    description: Show the network path to the target
    description.de: Netzwerkpfad zum Ziel anzeigen
    default: false
    order: 51

  - name: open_only
    type: boolean
    flag: --open
    description: Show only open or possibly open ports
    description.de: Nur offene oder möglicherweise offene Ports anzeigen
    visible_when:
      parameter: host_discovery_only
      active: false
    default: false
    order: 52

  - name: verbosity
    type: options
    flag: ""
    description: Verbosity of the output
    description.de: Ausführlichkeit der Ausgabe
    order: 60
    options:
      - value: -v
        description: Verbose
        description.de: Ausführlich
      - value: -vv
        description: Very verbose
        description.de: Sehr ausführlich

  - name: output_normal
    type: text
    flag: -oN
    description: Additionally write the normal output to this file
    description.de: Normale Ausgabe zusätzlich in diese Datei schreiben
    example: nmap-scan.txt
    order: 70

  - name: target
    type: options
    flag: ""
    description: Predefined target; only scan networks you have permission for
    description.de: Vordefiniertes Ziel; nur Netzwerke scannen, für die eine Erlaubnis vorliegt
    required: true
    default: 127.0.0.1
    order: 1000
    options:
      - value: 127.0.0.1
        description: This computer
        description.de: Dieser Computer
      - value: scanme.nmap.org
        description: Public test target explicitly permitted by Nmap
        description.de: Öffentliches, von Nmap ausdrücklich erlaubtes Testziel
      - value: 192.168.0.0/24
        description: Common private home network
        description.de: Häufiges privates Heimnetz
      - value: 192.168.1.0/24
        description: Common private home network
        description.de: Häufiges privates Heimnetz
      - value: 192.168.178.0/24
        description: Common FRITZ!Box home network
        description.de: Häufiges FRITZ!Box-Heimnetz
      - value: 10.0.0.0/24
        description: Private 10.x network
        description.de: Privates 10er-Netz
      - value: 172.16.0.0/24
        description: Private 172.16.x network
        description.de: Privates 172.16er-Netz

help_text: |
  This simplified configuration covers only the commonly needed Nmap features.
  For free-form targets, NSE arguments, timing details, spoofing and special
  scan techniques, use the "Nmap Advanced" configuration.

  Examples:
  - Find hosts on the home network: `nmap -sn -T3 192.168.1.0/24`
  - Check web services: `nmap -sT -p 80,443 -sV -T3 --open 192.168.1.0/24`
  - Permitted test target: `nmap -sT -sV -T3 scanme.nmap.org`

  Only scan your own systems and networks you have explicit permission for.
help_text.de: |
  Diese vereinfachte Konfiguration enthält nur häufig benötigte Nmap-Funktionen.
  Für freie Ziele, NSE-Argumente, Timing-Details, Spoofing und spezielle
  Scanverfahren steht die Konfiguration "Nmap Advanced" bereit.

  Beispiele:
  - Hosts im Heimnetz finden: `nmap -sn -T3 192.168.1.0/24`
  - Webdienste prüfen: `nmap -sT -p 80,443 -sV -T3 --open 192.168.1.0/24`
  - Erlaubtes Testziel: `nmap -sT -sV -T3 scanme.nmap.org`

  Nur eigene Systeme und ausdrücklich freigegebene Netzwerke scannen.
