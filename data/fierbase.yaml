schema_version: 2
command: firebase
description: Firebase CLI for managing Firebase projects and services
description.de: Firebase-CLI zum Verwalten von Firebase-Projekten und -Diensten
parameters:
  - name: use_sudo
    type: boolean
    flag: "sudo"
    description: Run the command with elevated privileges (if necessary)
    description.de: Den Befehl mit erhöhten Rechten ausführen (falls nötig)
    default: false
    order: 0
  - name: action
    type: options
    flag: ""
    description: Specify the Firebase action to perform
    description.de: Die auszuführende Firebase-Aktion wählen
    order: 1
    options:
      - value: "login"
        description: Log in to the Firebase CLI
        description.de: Bei der Firebase-CLI anmelden
      - value: "logout"
        description: Log out of the Firebase CLI
        description.de: Von der Firebase-CLI abmelden
      - value: "init"
        description: Initialize a Firebase project
        description.de: Ein Firebase-Projekt initialisieren
      - value: "deploy"
        description: Deploy Firebase services
        description.de: Firebase-Dienste bereitstellen
      - value: "emulators:start"
        description: Start the Firebase emulators
        description.de: Die Firebase-Emulatoren starten
      - value: "emulators:exec"
        description: Run a script using the Firebase emulators
        description.de: Ein Skript mit den Firebase-Emulatoren ausführen
      - value: "functions:log"
        description: View logs from deployed Firebase functions
        description.de: Logs bereitgestellter Firebase-Functions ansehen
      - value: "hosting:disable"
        description: Disable Firebase Hosting
        description.de: Firebase Hosting deaktivieren
      - value: "firestore:indexes"
        description: Manage Firestore indexes
        description.de: Firestore-Indizes verwalten
      - value: "apps:list"
        description: List all Firebase apps in the project
        description.de: Alle Firebase-Apps im Projekt auflisten
      - value: "apps:create"
        description: Create a new Firebase app
        description.de: Eine neue Firebase-App erstellen
      - value: "projects:list"
        description: List all Firebase projects
        description.de: Alle Firebase-Projekte auflisten
      - value: "projects:create"
        description: Create a new Firebase project
        description.de: Ein neues Firebase-Projekt erstellen
  - name: project
    type: text
    flag: "--project"
    description: Specify the Firebase project ID
    description.de: Die Firebase-Projekt-ID angeben
    example: "my-firebase-project"
    required: false
    order: 2
  - name: only
    type: options
    flag: "--only"
    description: Limit the deploy command to specific Firebase services
    description.de: Den Deploy-Befehl auf bestimmte Firebase-Dienste beschränken
    order: 3
    options:
      - value: "hosting"
        description: Deploy only the hosting service
        description.de: Nur den Hosting-Dienst bereitstellen
      - value: "functions"
        description: Deploy only cloud functions
        description.de: Nur Cloud Functions bereitstellen
      - value: "firestore"
        description: Deploy Firestore rules and indexes
        description.de: Firestore-Regeln und -Indizes bereitstellen
      - value: "storage"
        description: Deploy storage rules
        description.de: Storage-Regeln bereitstellen
      - value: "database"
        description: Deploy Realtime Database rules
        description.de: Regeln der Realtime Database bereitstellen
      - value: "emulators"
        description: Deploy emulator configuration
        description.de: Emulator-Konfiguration bereitstellen
  - name: except
    type: text
    flag: "--except"
    description: Exclude specific targets from the deploy command
    description.de: Bestimmte Ziele vom Deploy-Befehl ausschließen
    example: "functions"
    required: false
    order: 4
  - name: token
    type: text
    flag: "--token"
    description: Provide an authentication token for CI/CD
    description.de: Ein Authentifizierungs-Token für CI/CD angeben
    example: "ya29.a0AfH6SM..."
    required: false
    order: 5
  - name: emulator_script
    type: text
    flag: ""
    description: The script to execute with `emulators:exec` (for Firebase emulators)
    description.de: Das mit `emulators:exec` auszuführende Skript (für Firebase-Emulatoren)
    example: "npm test"
    required: false
    order: 6
  - name: verbose
    type: boolean
    flag: "--debug"
    description: Enable verbose debug output
    description.de: Ausführliche Debug-Ausgabe aktivieren
    default: false
    order: 7
help_text: |
  Firebase CLI helps you manage Firebase projects and services, deploy resources, and emulate Firebase locally.

  Common use cases:
  - Log in to Firebase CLI: `firebase login`
  - Deploy all Firebase services: `firebase deploy`
  - Deploy only hosting: `firebase deploy --only hosting`
  - Start Firebase emulators: `firebase emulators:start`
  - Deploy with a specific project: `firebase deploy --project my-firebase-project`
  - Use an authentication token: `firebase deploy --token <your-token>`

  For more information, visit: https://firebase.google.com/docs/cli
help_text.de: |
  Die Firebase-CLI verwaltet Firebase-Projekte und -Dienste, stellt Ressourcen bereit und emuliert Firebase lokal.

  Typische Anwendungsfälle:
  - Bei der Firebase-CLI anmelden: `firebase login`
  - Alle Firebase-Dienste bereitstellen: `firebase deploy`
  - Nur Hosting bereitstellen: `firebase deploy --only hosting`
  - Firebase-Emulatoren starten: `firebase emulators:start`
  - Mit bestimmtem Projekt bereitstellen: `firebase deploy --project mein-firebase-projekt`
  - Authentifizierungs-Token verwenden: `firebase deploy --token <dein-token>`

  Weitere Informationen: https://firebase.google.com/docs/cli
