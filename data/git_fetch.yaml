# git_fetch.yaml
command: git_fetch
description: Holt Änderungen von einem Remote‑Repository
parameters:
  - name: use_sudo
    type: boolean
    flag: "sudo"
    description: Mit Root‑Rechten ausführen
    default: false
    order: 0

  - name: remote
    type: text
    flag: ""
    description: Name des Remotes (z. B. origin)
    example: "origin"
    required: false
    order: 1

  - name: prune
    type: boolean
    flag: "--prune"
    description: Entfernt lokal nicht mehr existierende Branches
    default: false
    order: 2

  - name: all
    type: boolean
    flag: "--all"
    description: Alle Remotes abrufen
    default: false
    order: 3

  - name: verbose
    type: boolean
    flag: "-v"
    description: Ausführliche Ausgabe
    default: false
    order: 4

help_text: |
  Standard‑Anwendung:
  - Änderungen vom Default‑Remote holen: `git fetch`
  - Von spezieller Remote holen: `git fetch origin`
  - Nicht mehr vorhandene Branches löschen: `git fetch --prune`
