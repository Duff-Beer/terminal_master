schema_version: 2
command: mkdir
description: Create directories
description.de: Verzeichnisse erstellen
parameters:

  - name: use_sudo
    type: boolean
    flag: "sudo"
    description: Run the command with elevated privileges (sudo)
    description.de: Den Befehl mit erhöhten Rechten ausführen (sudo)
    default: false

  - name: parents
    type: boolean
    flag: "-p"
    description: Create parent directories if they don't exist
    description.de: Übergeordnete Verzeichnisse anlegen, falls sie fehlen
    default: false

  - name: mode
    type: options
    flag: "-m"
    description: Set directory permissions
    description.de: Verzeichnisrechte setzen
    options:
      - value: "755"
        description: Standard executable directory (owner full, group/others read/execute)
        description.de: Standardverzeichnis (Eigentümer alles, Gruppe/Andere lesen/ausführen)
      - value: "700"
        description: Private directory (owner only)
        description.de: Privates Verzeichnis (nur Eigentümer)
      - value: "777"
        description: Fully open permissions (not recommended)
        description.de: Vollständig offene Rechte (nicht empfohlen)

  - name: verbose
    type: boolean
    flag: "-v"
    description: Print information about created directories
    description.de: Informationen zu erstellten Verzeichnissen ausgeben
    default: false

  - name: path
    type: filepath
    mode: directory
    required: true
    description: Path where directory will be created
    description.de: Pfad, an dem das Verzeichnis erstellt wird
    example: "/home/user/newdirectory"

help_text: |
  mkdir allows you to create new directories in the file system.
  Supports creating nested directories and setting custom permissions.
help_text.de: |
  mkdir erstellt neue Verzeichnisse im Dateisystem.
  Unterstützt verschachtelte Verzeichnisse und eigene Zugriffsrechte.
