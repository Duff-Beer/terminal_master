# -demo.yaml
schema_version: 2
commands:
  - title: Show current directory
    title.de: Zeige aktuelles Verzeichnis
    description: Runs `pwd` and shows the current path.
    description.de: Führt `pwd` aus und zeigt den aktuellen Pfad.
    command: pwd

  - title: Show directory contents
    title.de: Zeige Inhalt des Verzeichnisses
    description: Lists files in the current directory with details.
    description.de: Listet Dateien im aktuellen Verzeichnis mit Details.
    command: ls -la

  - title: Show date and time
    title.de: Zeige Datum und Uhrzeit
    description: Prints the current date and time.
    description.de: Gibt das aktuelle Datum und die Uhrzeit aus.
    command: date

  - title: Show network configuration
    title.de: Zeige Netzwerk-Konfiguration
    description: Prints IP and network details.
    description.de: Gibt IP- und Netzwerkdetails aus.
    command: ifconfig

  - title: Show environment variables
    title.de: Umgebungsvariablen anzeigen
    description: Prints all environment variables.
    description.de: Druckt alle Umgebungsvariablen.
    command: env
