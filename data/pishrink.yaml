schema_version: 2
command: pishrink
description: A utility to shrink Raspberry Pi image files
description.de: Ein Werkzeug zum Verkleinern von Raspberry-Pi-Image-Dateien
parameters:
  - name: use_sudo
    type: boolean
    flag: "sudo"
    description: Run the command with elevated privileges
    description.de: Den Befehl mit erhöhten Rechten ausführen
    default: true
    order: 0
  - name: input_file
    type: filepath
    mode: file
    required: true
    description: Path to the Raspberry Pi image file to shrink
    description.de: Pfad zur zu verkleinernden Raspberry-Pi-Image-Datei
    example: "/path/to/image.img"
    order: 1
  - name: output_file
    type: filepath
    mode: file
    description: Specify a custom output file for the shrunken image
    description.de: Eigene Ausgabedatei für das verkleinerte Image angeben
    flag: "--output"
    example: "/path/to/output.img"
    depends_on:
      - input_file
    must_differ: true # Ensures output_file is not the same as input_file
    order: 2
  - name: force
    type: boolean
    flag: "-f"
    description: Force shrinking without confirmation prompts
    description.de: Verkleinern ohne Rückfragen erzwingen
    default: false
    order: 3
  - name: preserve_original
    type: boolean
    flag: "-p"
    description: Preserve the original image instead of overwriting it
    description.de: Das Original-Image behalten statt es zu überschreiben
    default: false
    conflicts_with:
      - output_file
    order: 4
  - name: verbose
    type: boolean
    flag: "-v"
    description: Enable verbose output for detailed information
    description.de: Ausführliche Ausgabe für mehr Details aktivieren
    default: false
    order: 5
help_text: |
  PiShrink is a utility designed to reduce the size of Raspberry Pi image files. It removes unused space and optimizes the image for distribution.

  Common use cases:
  - Shrinking an image file: `sudo pishrink /path/to/image.img`
  - Shrinking and preserving the original file: `sudo pishrink -p /path/to/image.img`
  - Specifying an output file: `sudo pishrink /path/to/image.img --output /path/to/output.img`

  Always ensure you have backups of your image files before using PiShrink to prevent data loss.
help_text.de: |
  PiShrink verkleinert Raspberry-Pi-Image-Dateien. Es entfernt ungenutzten Speicher und optimiert das Image für die Weitergabe.

  Typische Anwendungsfälle:
  - Image verkleinern: `sudo pishrink /pfad/zum/image.img`
  - Verkleinern und Original behalten: `sudo pishrink -p /pfad/zum/image.img`
  - Ausgabedatei angeben: `sudo pishrink /pfad/zum/image.img --output /pfad/zur/ausgabe.img`

  Lege vor dem Einsatz von PiShrink immer Sicherungen deiner Image-Dateien an, um Datenverlust zu vermeiden.
