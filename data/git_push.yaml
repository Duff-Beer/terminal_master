# git_push.yaml
schema_version: 2
command: git_push
description: Pushes local commits to a remote repository
description.de: Überträgt lokale Commits in ein Remote‑Repository
parameters:
  - name: use_sudo
    type: boolean
    flag: "sudo"
    description: Run with root privileges
    description.de: Mit Root‑Rechten ausführen
    default: false
    order: 0

  - name: remote
    type: text
    flag: ""
    description: Name of the remote (e.g. origin)
    description.de: Name des Remotes (z. B. origin)
    example: "origin"
    required: false
    order: 1

  - name: branch
    type: text
    flag: ""
    description: Branch name to push
    description.de: Branch‑Name zum Pushen
    example: "main"
    required: false
    order: 2

  - name: set_upstream
    type: boolean
    flag: "--set-upstream"
    description: Set the upstream branch
    description.de: Upstream‑Branch setzen
    default: false
    order: 3

  - name: force
    type: boolean
    flag: "--force"
    description: Force the push (dangerous!)
    description.de: Erzwingt den Push (dangerous!)
    default: false
    order: 4

  - name: verbose
    type: boolean
    flag: "-v"
    description: Verbose output
    description.de: Ausführliche Ausgabe
    default: false
    order: 5

help_text: |
  Common usage:
  - Simple push: `git push`
  - Push to origin/main: `git push origin main`
  - Push and set upstream: `git push --set-upstream origin feature-branch`
help_text.de: |
  Standard‑Anwendung:
  - Einfaches Pushen: `git push`
  - Push auf origin/main: `git push origin main`
  - Push & setze upstream: `git push --set-upstream origin feature-branch`
