# git_push.yaml
schema_version: 1
command: git_push
description: Überträgt lokale Commits in ein Remote‑Repository
parameters:
  - name: use_sudo
    type: boolean
    flag: "sudo"
    description: Mit Root‑Rechten ausführen
    default: false
    order: 0

  - name: remote
    type: text
    flag: ""
    description: Name des Remotes (z. B. origin)
    example: "origin"
    required: false
    order: 1

  - name: branch
    type: text
    flag: ""
    description: Branch‑Name zum Pushen
    example: "main"
    required: false
    order: 2

  - name: set_upstream
    type: boolean
    flag: "--set-upstream"
    description: Upstream‑Branch setzen
    default: false
    order: 3

  - name: force
    type: boolean
    flag: "--force"
    description: Erzwingt den Push (dangerous!)
    default: false
    order: 4

  - name: verbose
    type: boolean
    flag: "-v"
    description: Ausführliche Ausgabe
    default: false
    order: 5

help_text: |
  Standard‑Anwendung:
  - Einfaches Pushen: `git push`
  - Push auf origin/main: `git push origin main`
  - Push & setze upstream: `git push --set-upstream origin feature-branch`
