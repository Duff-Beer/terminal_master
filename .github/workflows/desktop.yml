name: Desktop CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.38.9

jobs:
  validate:
    name: Analyze and test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build:
    name: Build ${{ matrix.name }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
            command: flutter build macos --release
            integration_command: flutter test integration_test/terminal_pty_test.dart -d macos
          - name: Windows
            os: windows-2022
            command: flutter build windows --release
            integration_command: flutter test integration_test/terminal_pty_test.dart -d windows
          - name: Linux
            os: ubuntu-22.04
            command: flutter build linux --release
            integration_command: xvfb-run -a flutter test integration_test/terminal_pty_test.dart -d linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev xvfb
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: ${{ matrix.command }}
      - name: Test native PTY
        run: ${{ matrix.integration_command }}
