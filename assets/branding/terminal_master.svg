  <path d="m340 458 117 104-117 104" fill="none" stroke="url(#prompt)" stroke-linecap="round" stroke-linejoin="round" stroke-width="58"/>
  <path d="M513 678h171" fill="none" stroke="#dceaf4" stroke-linecap="round" stroke-width="55"/>
  <path d="M716 173h2c49 0 89 40 89 89v493" fill="none" stroke="#44627f" stroke-linecap="round" stroke-width="9" opacity=".75"/>
