<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Terminal Master</title>
  <desc id="desc">A command prompt on a layered dark terminal window.</desc>
  <defs>
    <linearGradient id="shell" x1="128" y1="96" x2="896" y2="928" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17283f"/>
      <stop offset="1" stop-color="#07111e"/>
    </linearGradient>
    <linearGradient id="screen" x1="270" y1="292" x2="774" y2="796" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10263a"/>
      <stop offset="1" stop-color="#091622"/>
    </linearGradient>
    <linearGradient id="prompt" x1="339" y1="442" x2="676" y2="672" gradientUnits="userSpaceOnUse">
      <stop stop-color="#54f1b5"/>
      <stop offset="1" stop-color="#24b985"/>
    </linearGradient>
    <filter id="shadow" x="64" y="48" width="896" height="928" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="34" stdDeviation="34" flood-color="#020712" flood-opacity=".48"/>
    </filter>
  </defs>
  <rect x="96" y="80" width="832" height="832" rx="210" fill="url(#shell)" filter="url(#shadow)"/>
